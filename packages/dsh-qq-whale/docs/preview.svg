<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img">
  <title>QQ 会话的工具面被收窄：只留下对话与读写类工具，其余置灰摘除</title>
  <!-- 左侧：QQ 会话气泡（抽象，不含文字） -->
  <g fill="none" stroke="#4C8DFF" stroke-width="3" stroke-linejoin="round">
    <rect x="40" y="86" width="150" height="96" rx="16" fill="#4C8DFF" fill-opacity="0.12"/>
    <path d="M74 182 l-6 26 l28 -22" fill="#4C8DFF" fill-opacity="0.12"/>
    <path d="M70 118 h88 M70 140 h66 M70 162 h44" stroke-linecap="round" stroke-opacity="0.75"/>
  </g>
  <!-- 中间：收窄闸门 -->
  <g fill="none" stroke="#8A94A6" stroke-width="3" stroke-linecap="round">
    <path d="M232 134 h56"/>
    <path d="M276 126 l12 8 l-12 8"/>
  </g>
  <g fill="none" stroke="#22B07D" stroke-width="3" stroke-linejoin="round">
    <rect x="300" y="96" width="18" height="76" rx="6" fill="#22B07D" fill-opacity="0.18"/>
    <rect x="326" y="96" width="18" height="76" rx="6" fill="#22B07D" fill-opacity="0.18"/>
  </g>
  <!-- 右侧：保留下来的工具格 -->
  <g fill="none" stroke="#22B07D" stroke-width="3" stroke-linejoin="round">
    <rect x="374" y="76" width="96" height="56" rx="12" fill="#22B07D" fill-opacity="0.10"/>
    <rect x="374" y="148" width="96" height="56" rx="12" fill="#22B07D" fill-opacity="0.10"/>
    <circle cx="422" cy="104" r="12"/>
    <path d="M400 176 h44 M400 190 h28" stroke-linecap="round" stroke-opacity="0.7"/>
  </g>
  <!-- 右侧：被摘除的工具格（虚线 + 斜杠） -->
  <g fill="none" stroke="#8A94A6" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6">
    <rect x="496" y="76" width="96" height="56" rx="12"/>
    <rect x="496" y="148" width="96" height="56" rx="12"/>
  </g>
  <g fill="none" stroke="#8A94A6" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8">
    <path d="M508 88 l20 20 M528 88 l-20 20"/>
    <path d="M508 160 l20 20 M528 160 l-20 20"/>
  </g>
  <!-- 底部：一份对话仍在继续的暗示 -->
  <g fill="none" stroke="#4C8DFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.55">
    <path d="M96 232 h120 M96 250 h72"/>
    <circle cx="248" cy="241" r="4" fill="#4C8DFF" stroke="none" fill-opacity="0.6"/>
    <circle cx="266" cy="241" r="4" fill="#4C8DFF" stroke="none" fill-opacity="0.4"/>
    <circle cx="284" cy="241" r="4" fill="#4C8DFF" stroke="none" fill-opacity="0.25"/>
  </g>
</svg>
