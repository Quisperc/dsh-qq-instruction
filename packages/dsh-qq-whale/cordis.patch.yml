# dsh-qq-whale 的 bundle 补丁：往 profile 组合树里插两条。
#   id: dsh-qq-whale  —— 本插件自己的条目
#   id: preset-qq     —— QQ 场景的能力装配单（用户还需在 dsh-qq-bot 设置页把
#                        「自定义 agent preset id」填成 qq，只影响新会话）
#
# 为什么不用 standard：standard 是给"人坐在终端前"设计的；QQ 群里**群友能触发 Agent**，
# 所以按最小权限砍掉 shell、文件搜索、后台任务、子代理/工作流、联网。
# 砍了哪些、为什么，见 docs/04-explanation/decisions/ADR-010。
#
# 人格两条通道（别混）：preset 的 persona.prefix 进**系统提示**（每轮都在）；
# dsh-qq-bot 的 persona.text 只拼在**首轮用户消息末尾**（一次）。所以
# prefix 只做「反助手」风格锚点，"是谁/性格/雷区"全交给人设卡。
#
# 配置不写在这里：文件会随升级被覆盖，出厂值在 lib/config.js。
# id 是配置键（改包名不变），name 必须是安装后的真实包名。
- insert:
    - id: dsh-qq-whale
      name: 'dsh-qq-whale'

    - id: preset-qq
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: qq
        name: 'QQ 群聊（受限）'
        description: 'QQ 场景能力集：保留人格/指令/时间/工作区/压缩/交互，去掉 shell、文件搜索、后台任务、子代理与联网'
        plugins:
          # —— 人格与指令 ——
          # standard 这里默认是 "You are a coding agent…"，不换掉会和人设卡打架。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是群里的聊天搭子，不是助手。说话简短自然。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          # —— 工作区：QQ 每个会话落在 QQ_msg 下，记忆靠文件读写 ——
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          # —— 长会话压缩（群聊越聊越长，不能没有） ——
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # —— 交互：真人的「活人感」来源（反问的分寸写在 persona/whale.md） ——
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # —— 注意：工具收窄**不在**这张清单里做 ——
          # preset 只决定挂哪些插件行，不收窄全局工具（只写清单时实测 80+ 个工具全可见）。
          # 也不能在这里挂一行 restrict：agent 刚创建时工具还没注册完，名单会缩水。
          # 真正的收窄在宿主半 lib/agent-guard.js：agent/created 装 guard（执行期拦），
          # 首个 pre-step 再 restrict（隐藏）。好处是老会话也管得住。

          # —— 显式禁用（官方默认已 disabled，写死防默认值变化） ——
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true

          # —— 评估过、暂不启用（要用就去掉对应注释） ——
          # tool-schedule：唯一能"到点提醒"的官方件，但绕开 qq-bot 的 proactive 节流，
          #   群友一句"每十分钟提醒我"就能刷屏。
          # tool-jobs：只有 list/output/kill，没有启动工具（启动在 tool-bash，已砍）。
          # tool-goal / planning：会驱动会话自动续接多轮 / 需要人批准，群里不可控。
          # tool-skill：只加载指令文本，群里收益低。
          # - id: tool-skill
          #   name: '@deepseek-ai/dsh-tool-skill'
          # - id: tool-schedule
          #   name: '@deepseek-ai/dsh-tool-schedule'
