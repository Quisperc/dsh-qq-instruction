# dsh-qq-vault 的 bundle 补丁：把插件插进 profile 的组合树。
#
# 【为什么不在这里写 config】
#   这个文件会随插件升级被覆盖。默认值在 lib/bundle.js 的 resolvePaths() 里：
#   home = $DSH_HOME、profile = web、workspace = <home>/Documents/deepseek-harness/QQ_msg。
#   要改就写进 $DSH_HOME/profiles/<profile>/cordis.patch.yml（在所有 bundle 之后应用）：
#
#     - id: dsh-qq-vault
#       config:
#         workspace: /path/to/QQ_msg
#
# 【装法】
#   本仓库没有发布 npm，用 scripts/install-whale.mjs 同款思路（软链 + 两处登记）：
#     1. 软链 packages/dsh-qq-vault → $DSH_HOME/profiles/web/node_modules/dsh-qq-vault
#     2. 在 profile package.json 的 dependencies 登记（否则插件页「已安装」看不到）
#     3. 在 dsh.profile.bundles 追加 dsh-qq-vault
#   详见 README「安装」。
#
- insert:
    - id: dsh-qq-vault
      name: 'dsh-qq-vault'
