# dsh-qq-voice 的 bundle 补丁：只往 profile 组合树里插自己这一条。
#
# 为什么不动 preset-qq：那行归 dsh-qq-whale 管（ADR-012 定的边界）。本插件不需要
# 会话里多挂任何插件行——它只是往工具注册表里加一个 `qq_voice`，工具对所有 agent 可见，
# 要不要让它被 QQ 会话用到，由 whale 的白名单决定（见 README「和 whale 的关系」）。
#
# 配置不写在这里：文件会随升级被覆盖，出厂值在 lib/config.js，运行时值由设置页写进
# profile 的 cordis.patch.yml（同名条目 + config 段，按 id 合并，不会丢掉 name）。
- insert:
    - id: dsh-qq-voice
      name: 'dsh-qq-voice'
